name = "tech"
compatibility_date = "2026-05-26"
compatibility_flags = ["nodejs_compat"]

# For Cloudflare Pages
pages_build_output_dir = "dist"

[observability]
enabled = true

# Bindings - configure these in the Pages dashboard instead for best results
[[kv_namespaces]]
binding = "KV"

[[d1_databases]]
binding = "DB"
database_name = "epic-ai-db"

[[r2_buckets]]
binding = "R2"
bucket_name = "epic-ai-media"

[[vectorize]]
binding = "VECTORIZE"
index_name = "character-memory"

[ai]
binding = "AI"
