name = "tech"
compatibility_date = "2026-05-26"
compatibility_flags = ["nodejs_compat"]

# Static assets (your React + Three.js app)
[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[observability]
enabled = true

[observability.logs]
enabled = true

# Your bindings
[[kv_namespaces]]
binding = "KV"

[[r2_buckets]]
binding = "R2"
bucket_name = "epic-ai-media"

[[vectorize]]
binding = "VECTORIZE"
index_name = "character-memory"

[ai]
binding = "AI"
