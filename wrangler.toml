name = "tech"
compatibility_date = "2026-05-26"
compatibility_flags = ["nodejs_compat"]

# === Static Assets (this is what you need for your React app) ===
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Observability
[observability]
enabled = true

[observability.logs]
enabled = true

# ========================
# Bindings
# ========================

[[kv_namespaces]]
binding = "KV"

[[r2_buckets]]
binding = "R2"
bucket_name = "epic-ai-media"

[[vectorize]]
binding = "VECTORIZE"
index_name = "character-memory"

[ai]
binding = "AI"
