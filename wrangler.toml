name = "tech"
compatibility_date = "2026-05-26"
compatibility_flags = ["nodejs_compat"]

# ====================
# Cloudflare Pages Config
# ====================
pages_build_output_dir = "dist"

# Observability (updated based on what you just showed)
[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = false   # Keep false unless you need tracing

# ====================
# Bindings (recommended)
# ====================

[[kv_namespaces]]
binding = "KV"

[[r2_buckets]]
binding = "R2"
bucket_name = "epic-ai-media"

[[vectorize]]
binding = "VECTORIZE"
index_name = "character-memory"

[ai]
binding = "AI"
