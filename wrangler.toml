name = "tech"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# Required for Cloudflare Pages + Functions
pages_build_output_dir = "dist"

# Account ID for this project (used by wrangler)
account_id = "4f00441f1f72053ee62f67d115615dc2"

[[kv_namespaces]]
binding = "KV"

[[r2_buckets]]
binding = "R2"
bucket_name = "epic-ai-media"

[[vectorize]]
binding = "VECTORIZE"
index_name = "character-memory"

[ai]
binding = "AI"
