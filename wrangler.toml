name = "tech"
compatibility_date = "2026-05-26"
compatibility_flags = ["nodejs_compat"]

# === Pages Configuration ===
pages_build_output_dir = "dist"

# Optional: Enable logs
[observability]
enabled = true

# ========================
# Bindings (recommended to also add these in Cloudflare Dashboard)
# ========================

# KV Namespace
[[kv_namespaces]]
binding = "KV"
id = "YOUR_KV_ID_HERE"          # ← Change this or remove if using dashboard

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "epic-ai-db"
database_id = "YOUR_D1_ID_HERE"   # ← Change this or remove if using dashboard

# R2 Bucket
[[r2_buckets]]
binding = "R2"
bucket_name = "epic-ai-media"

# Vectorize Index
[[vectorize]]
binding = "VECTORIZE"
index_name = "character-memory"

# AI Gateway / Workers AI
[ai]
binding = "AI"

# Images Binding (for image optimization)
[images]
binding = "IMAGES"
