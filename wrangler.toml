name = "tech"
compatibility_date = "2026-05-26"
compatibility_flags = ["nodejs_compat"]

# === THIS IS WHAT MAKES /api/generate WORK ===
pages_build_output_dir = "dist"

[observability]
enabled = true

[observability.logs]
enabled = true

# Bindings
[[kv_namespaces]]
binding = "KV"

[[r2_buckets]]
binding = "R2"
bucket_name = "epic-ai-media"

[[vectorize]]
binding = "VECTORIZE"
index_name = "character-memory"

[ai]
binding = "AI"
